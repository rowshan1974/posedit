<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - PosEdit $16.00</title>
    <style>
        :root {
            --success-color: #10b981;
            --success-glow: rgba(16, 185, 129, 0.25);
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .receipt-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 36px 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Success Animated Badge */
        .success-badge {
            width: 76px;
            height: 76px;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid var(--success-color);
            color: var(--success-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 18px;
            box-shadow: 0 0 20px var(--success-glow);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .subtext {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* Amount Highlight */
        .amount-tag {
            background: #0f172a;
            border: 1px dashed var(--success-color);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .amount-tag span {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .amount-tag h2 {
            font-size: 2.2rem;
            color: var(--success-color);
            font-weight: 800;
            margin-top: 4px;
        }

        /* Receipt Line Items */
        .receipt-details {
            background: #152033;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 24px;
            text-align: left;
            font-size: 0.88rem;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .receipt-row:last-child {
            border-bottom: none;
        }

        .receipt-row .label {
            color: var(--text-muted);
        }

        .receipt-row .value {
            font-weight: 600;
            color: var(--text-main);
            font-family: monospace;
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-decoration: none;
            display: block;
        }

        .btn-primary {
            background: var(--primary);
            color: #0f172a;
        }

        .btn-primary:hover {
            background: #7dd3fc;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media print {
            body { background: white; color: black; }
            .receipt-card { box-shadow: none; border: 1px solid #ccc; }
            .btn-group { display: none; }
        }
    </style>
</head>
<body>

<div class="receipt-card">
    <div class="success-badge">✓</div>
    
    <h1>Payment Successful!</h1>
    <p class="subtext">Your PayPal transaction has been verified.</p>

    <div class="amount-tag">
        <span>Amount Paid</span>
        <h2>$16.00 USD</h2>
    </div>

    <div class="receipt-details">
        <div class="receipt-row">
            <span class="label">Product</span>
            <span class="value" style="font-family: inherit;">PosEdit System License</span>
        </div>
        <div class="receipt-row">
            <span class="label">Payment Gateway</span>
            <span class="value">PayPal / Card</span>
        </div>
        <div class="receipt-row">
            <span class="label">Status</span>
            <span class="value" style="color: var(--success-color);">COMPLETED</span>
        </div>
        <div class="receipt-row">
            <span class="label">Transaction ID</span>
            <span class="value" id="tx-id">PAYID-M99384721</span>
        </div>
        <div class="receipt-row">
            <span class="label">Date & Time</span>
            <span class="value" id="current-date"></span>
        </div>
    </div>

    <div class="btn-group">
        <a href="https://rowshan1974.github.io/posedit/" class="btn btn-primary">
            🚀 Open PosEdit System
        </a>
        <button onclick="window.print()" class="btn btn-secondary">
            🖨️ Print Receipt
        </button>
    </div>
</div>

<script>
    // Set live date and transaction code
    document.getElementById('current-date').innerText = new Date().toLocaleString();
    
    // Generate realistic PayPal Transaction ID if not already passed
    const randomCode = Math.floor(10000000 + Math.random() * 90000000);
    document.getElementById('tx-id').innerText = "PAYID-" + randomCode;
</script>

</body>
</html>
