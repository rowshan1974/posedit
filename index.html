<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PosEdit Pro - Complete $16.00 Payment</title>
    
    <!-- PayPal Official SDK (Change 'sb' to your live PayPal Client ID) -->
    <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD"></script>

    <style>
        :root {
            --primary: #0070ba;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .checkout-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-header h1 {
            font-size: 1.6rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .brand-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Order Summary */
        .order-card {
            background: #0f172a;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border: 1px solid #1e293b;
        }

        .order-info h3 {
            font-size: 1rem;
            font-weight: 600;
        }

        .order-info span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .order-price {
            font-size: 1.6rem;
            font-weight: 700;
            color: #4ade80;
        }

        /* Payment Container */
        #paypal-button-container {
            margin-top: 15px;
            z-index: 1;
        }

        /* Notification boxes */
        .alert-box {
            display: none;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .alert-success {
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid #4ade80;
            color: #4ade80;
        }

        .alert-error {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid #f87171;
            color: #f87171;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="checkout-container">
    <div class="brand-header">
        <h1>PosEdit Pro Gateway</h1>
        <p>Official Secure Checkout System</p>
    </div>

    <!-- Product Plan -->
    <div class="order-card">
        <div class="order-info">
            <h3>PosEdit Lifetime License</h3>
            <span>Full System Access & Unlocked Storage</span>
        </div>
        <div class="order-price">$16.00</div>
    </div>

    <!-- Real Gateway Buttons -->
    <div id="paypal-button-container"></div>

    <!-- Status Messages -->
    <div id="success-alert" class="alert-box alert-success">
        ✓ <strong>Payment Successful!</strong><br>
        Transaction ID: <span id="payment-id"></span><br>
        Thank you for purchasing PosEdit!
    </div>

    <div id="error-alert" class="alert-box alert-error">
        ⚠ Payment failed or was canceled. Please try again.
    </div>

    <div class="footer-note">
        🔒 Real-time 256-bit Encrypted Payment Gateway
    </div>
</div>

<script>
    // Initialize Real PayPal & Card Gateway
    paypal.Buttons({
        style: {
            layout: 'vertical',
            color:  'gold',
            shape:  'rect',
            label:  'pay'
        },

        // 1. Setup $16.00 Transaction
        createOrder: function(data, actions) {
            return actions.order.create({
                purchase_units: [{
                    description: "PosEdit Pro License",
                    amount: {
                        currency_code: "USD",
                        value: "16.00"
                    }
                }]
            });
        },

        // 2. Capture payment upon customer approval
        onApprove: function(data, actions) {
            return actions.order.capture().then(function(details) {
                // Hide Gateway buttons
                document.getElementById('paypal-button-container').style.display = 'none';
                
                // Show Success message
                const successBox = document.getElementById('success-alert');
                document.getElementById('payment-id').innerText = details.id;
                successBox.style.display = 'block';

                console.log('Transaction completed by ' + details.payer.name.given_name);
            });
        },

        // 3. Handle Cancel/Errors
        onError: function(err) {
            console.error(err);
            document.getElementById('error-alert').style.display = 'block';
        }
    }).render('#paypal-button-container');
</script>

</body>
</html>
